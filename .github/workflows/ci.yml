name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      LOKY_MAX_CPU_COUNT: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Verify real bundle, measured results and links
        run: python scripts/verify_publication.py
      - name: Run behavioral and dashboard tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Verify installed command
        run: workforce --help
